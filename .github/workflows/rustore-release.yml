name: RuStore Signed Release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustore-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wifi-sonar-release.jks"
          test -s "$RUNNER_TEMP/wifi-sonar-release.jks"
          chmod 600 "$RUNNER_TEMP/wifi-sonar-release.jks"
      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wifi-sonar-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/WiFi-Sonar-release.apk
          sha256sum release-assets/WiFi-Sonar-release.apk > release-assets/SHA256SUMS.txt
      - name: Prepare version metadata
        id: version
        run: |
          python3 - <<'PY'
          import json, pathlib, re, os
          gradle = pathlib.Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', gradle)
          code = re.search(r"\bversionCode\s*=\s*(\d+)", gradle)
          if not name or not code:
              raise SystemExit("Could not read versionName/versionCode")
          metadata = {"versionName": name.group(1), "versionCode": int(code.group(1))}
          pathlib.Path("release-assets/version.json").write_text(json.dumps(metadata) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_name={metadata['versionName']}\n")
          print(json.dumps(metadata))
          PY
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSonar-RuStore-Signed-APK
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: wifi-sonar-v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}
          RELEASE_TITLE: WiFi Sonar ${{ steps.version.outputs.version_name }} (signed)
        run: |
          gh release create "$RELEASE_TAG" release-assets/WiFi-Sonar-release.apk release-assets/version.json release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes "Signed Release APK built from main commit $GITHUB_SHA. Signature verified with apksigner. SHA-256 checksum is attached."
