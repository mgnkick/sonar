name: Android APK Build

on:
  push:
    branches: [main, master, feat/channel-interference-model]
    paths:
      - 'android/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'distributionUrl=.*gradle-8.7' gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:compileReleaseKotlin :app:assembleRelease

      - name: Verify APK outputs
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WiFiPulse-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
  publish-release:
    name: Publish APK release
    if: github.event_name != 'pull_request' && contains(fromJSON('["main","master"]'), github.ref_name)
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: WiFiPulse-Android-Release-APK
          path: release

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: release/app-release.apk
          RELEASE_TAG: wifi-sonar-build-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TITLE: WiFi Sonar APK build ${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automatically built from commit $GITHUB_SHA."
